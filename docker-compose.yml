services:
  mariadb:
    image: mariadb:11
    container_name: cattlestock-mariadb
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MARIADB_DATABASE: cattlestock
      MARIADB_USER: cattlestock
      MARIADB_PASSWORD: cattlestock
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - cattlestock-mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  cattlestock-mariadb:
