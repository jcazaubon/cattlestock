spring.application.name=cattlestock
gg.jte.developmentMode=true

# Base de datos: MariaDB en Docker (puerto 3307 para no chocar con MySQL local).
# Arrancar la base con: docker compose up -d
spring.datasource.url=jdbc:mariadb://localhost:3307/cattlestock
spring.datasource.username=cattlestock
spring.datasource.password=cattlestock
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# Sin Docker, con H2 en archivo (y consola en /h2-console):
# .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=local
